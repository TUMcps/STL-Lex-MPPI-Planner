[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "effects-of-discretization-and-solver-evaluations"
version = "0.1.0"
description = "effects-of-discretization-and-solver-evaluations"
readme = "README.md"
requires-python = ">=3.9,<3.12"
dependencies = [
  "joblib>=1.2",
  "matplotlib>=3.5",
  "numpy>=1.24",
  "pandas>=1.5",
  "scipy>=1.10",
  "tabulate>=0.9",
]

[tool.setuptools]
py-modules = [
  "batch_evaluations",
  "example_scenario",
  "solver_evaluations",
]

[tool.pdm]
python_requires = ">=3.9,<3.12"
